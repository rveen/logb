name: release viewer
on:
  push:
    tags: ['viewer/v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: viewer/go.mod
      - name: build
        working-directory: viewer
        env: { CGO_ENABLED: '0', GOWORK: 'off' }
        run: |
          mkdir -p out
          for t in linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ $os = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o out/logbview-$os-$arch$ext ./cmd/logbview
          done
          cd out && sha256sum * > SHA256SUMS
      - name: release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" viewer/out/* --title "logbview ${GITHUB_REF_NAME#viewer/}" --generate-notes
